[package]
name = "ai-visual-dialogue-assistant"
version = "0.1.0"
description = "AI Visual Dialogue Assistant — native desktop application with camera, voice, and chat."
authors = ["competition3"]
edition = "2021"

[lib]
name = "ai_visual_dialogue_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# This feature is used for production builds or when a dev server is not specified
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
