name = "ai-visual-dialogue-assistant"
main = "src/worker/index.ts"
compatibility_date = "2026-06-12"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "./dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[[durable_objects.bindings]]
name = "UPSTREAM_CIRCUIT_BREAKER"
class_name = "UpstreamCircuitBreaker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UpstreamCircuitBreaker"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"
OPENAI_PROVIDER_MODE = "chat"
