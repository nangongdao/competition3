name = "ai-visual-dialogue-assistant"
main = "src/worker/index.ts"
compatibility_date = "2026-06-12"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "./dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[[durable_objects.bindings]]
name = "UPSTREAM_CIRCUIT_BREAKER"
class_name = "UpstreamCircuitBreaker"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UpstreamCircuitBreaker", "RateLimiter"]

# 会话/消息持久化 D1 数据库。
# database_id 为占位：本地开发用 local 模拟，生产需 `wrangler d1 create` 后回填真实 UUID。
[[d1_databases]]
binding = "SESSIONS_DB"
database_name = "ai-visual-dialogue-sessions"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "production"
OPENAI_PROVIDER_MODE = "chat"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
