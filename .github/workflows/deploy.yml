name: Deploy to Cloudflare Workers (public)

# Cloudflare 公开部署 CD（runbook 收尾）。
#
# 在合并到 `main` 后自动执行生产构建 + `wrangler deploy`，把 Worker + 静态前端
# 发布到 Cloudflare Workers 的 workers.dev（或配置的自定义域名）公共地址。
#
# 前置条件（在 GitHub/CNB 仓库 Secrets 中配置）：
#   - CLOUDFLARE_API_TOKEN  具备 Workers / D1 / Durable Objects 写权限的 API Token
#   - CLOUDFLARE_ACCOUNT_ID  当前 Cloudflare 账号 ID（可选；wrangler 会从 token 推断）
#   - 生产所需敏感值通过 CI 一并写入 Worker secrets（见下方 job）
#
# 手动触发：Actions 页 → Run workflow（便于在首次配置 token 后做一次性发布验证）。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 仅在有发布权限的分支执行；PR 不触发（由 ci.yml 负责验证门禁）。
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # worker-configuration.d.ts 由 wrangler 生成且不入库。
      - name: 生成 Worker 类型
        run: npx wrangler types

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 生产构建
        run: pnpm build

      - name: 部署配置预检（退出码非 0 则中止）
        run: npx wrangler deploy --dry-run --outdir=/tmp/wrangler-dry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 应用 D1 迁移（生产 remote）
        run: npx wrangler d1 migrations apply ai-visual-dialogue-sessions --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 写入 Worker secrets（生产必需）
        run: |
          echo "${OPENAI_API_KEY}" | npx wrangler secret put OPENAI_API_KEY
          echo "${CLIENT_ACCESS_TOKEN}" | npx wrangler secret put CLIENT_ACCESS_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLIENT_ACCESS_TOKEN: ${{ secrets.CLIENT_ACCESS_TOKEN }}

      - name: 部署到 Cloudflare Workers（公开地址）
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
